name: Release

# Собирает портативный self-contained exe и публикует его в GitHub Release
# при пуше тега вида v0.2.0. Билд идёт на раннере GitHub из публичного
# исходного кода — логи сборки открыты, к артефакту прилагается SHA256.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish (portable single-file)
        # WanderRelease=true: счётчик сборки (PLAN AH) не крутится и в гите
        # его нет, так что у релиза четвёртое число — 0.
        run: |
          dotnet publish src/Wander.App `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:WanderRelease=true `
            -o publish

      - name: Compute checksum
        run: |
          $hash = (Get-FileHash publish/Wander.exe -Algorithm SHA256).Hash
          "$hash  Wander.exe" | Out-File publish/Wander.exe.sha256 -Encoding ascii
          Write-Host "SHA256: $hash"

      # Текст релиза - вводная секции версии из CHANGELOG, строки над первым
      # "###": английская сверху, русская под ней, у каждой ссылка на весь
      # CHANGELOG (решения человека 2026-10-09 и 2026-11-02: несколько строк,
      # до exe не листать). Нет вводной - вся секция и предупреждение; нет
      # английской секции - только русская и предупреждение: тег уже
      # опубликован, ронять выпуск из-за текста незачем.
      - name: Release notes
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $docs = "${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/docs"
          function Get-Section([string]$path) {
            $text = Get-Content -Raw -Encoding UTF8 $path
            $pattern = "(?ms)^## \[$([regex]::Escape($version))(?:-[^\]]*)?\][^\n]*\n(.*?)(?=^## \[|^\[[^\]]+\]:\s*http|\z)"
            $match = [regex]::Match($text, $pattern)
            if ($match.Success) { return $match.Groups[1].Value.Trim() }
            return $null
          }
          function Get-Lead([string]$section, [string]$path, [string]$more) {
            $lead = ($section -split '(?m)^### ', 2)[0].Trim()
            if (-not $lead) {
              Write-Host "::warning::$path has no lead above the first ### for $version - the whole section goes to the notes"
              $lead = $section
            }
            return "$lead`n`n[$more]($docs/$(Split-Path -Leaf $path))"
          }
          $ru = Get-Section 'docs/CHANGELOG.md'
          $en = Get-Section 'docs/CHANGELOG.en.md'
          if (-not $ru) { throw "docs/CHANGELOG.md has no section for $version" }
          $ruNotes = Get-Lead $ru 'docs/CHANGELOG.md' 'Все изменения'
          if ($en) {
            $enNotes = Get-Lead $en 'docs/CHANGELOG.en.md' 'Full changelog'
            $notes = "$enNotes`n`n---`n`n## По-русски`n`n$ruNotes"
          } else {
            Write-Output "::warning::docs/CHANGELOG.en.md has no section for $version - the notes are in Russian only"
            $notes = $ruNotes
          }
          [IO.File]::WriteAllText("$PWD/release-notes.md", $notes, (New-Object Text.UTF8Encoding($false)))

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            publish/Wander.exe `
            publish/Wander.exe.sha256 `
            --title "Wander ${{ github.ref_name }}" `
            --notes-file release-notes.md `
            --prerelease
