<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Пока грузится — в окне</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.tbtn{height:28px;display:flex;align-items:center;gap:6px;justify-content:center;border:1px solid transparent;border-radius:4px;background:transparent;color:inherit;padding:0 8px;cursor:default;font:inherit}
.t-light .tbtn:hover,.t-gal .tbtn:hover{background:#E5E5E5}
.t-dark .tbtn:hover,.t-galdark .tbtn:hover{background:#333333}
</style>
</helmet>
<div class="{{themeClass}}" style="box-sizing: border-box; height: 100%; min-height: 640px; display: flex; flex-direction: column; background: {{chrome}}; color: {{fg}}; font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px;">
  <div style="display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-bottom: 1px solid {{sep}}; flex-wrap: wrap;">
    <button type="button" class="tbtn" aria-label="Обновить — загрузить миниатюры заново" onClick="{{reload}}">
      <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M13 8a5 5 0 1 1-1.5-3.6"></path>
        <path d="M13 2.5v3h-3"></path>
      </svg>
      <span>Обновить</span>
    </button>
    <div style="display: flex; align-items: center; gap: 6px; padding: 4px 8px; border: 1px solid {{sep}}; background: {{fieldBg}}; min-width: 0; flex: 1 1 320px;">
      <span>D:</span><span style="color: {{dim}};">›</span><span>_ inbox</span><span style="color: {{dim}};">›</span><span>_на разбор</span>
    </div>
    <span style="color: {{dim}};">{{status}}</span>
  </div>
  <div style="flex: 1 1 auto; overflow: auto; background: {{listBg}}; color: {{listFg}}; padding: 6px; min-height: 0;">
    <div style="display: flex; flex-wrap: wrap; align-content: flex-start;">
      <sc-for list="{{items}}" as="it" hint-placeholder-count="14">
        <div style="box-sizing: border-box; width: {{v.cellW}}px; margin: {{v.margin}}px; padding: {{v.pad}}; display: flex; flex-direction: {{v.dir}}; align-items: center; gap: {{v.gap}}px; text-align: {{v.align}};">
          <div style="width: {{v.img}}px; height: {{v.img}}px; flex: none; margin: {{v.imgM}}; display: flex; align-items: center; justify-content: center;">
            <div style="position: relative; width: {{it.fw}}px; height: {{it.fh}}px;">
              <div style="position: absolute; inset: 0; opacity: {{it.phOp}}; transition: opacity {{fadeMs}}ms;">
                <sc-if value="{{it.isFolder}}" hint-placeholder-val="{{true}}">
                  <dc-import name="Folder" folder="{{it.folder}}" variant="Адаптивный" size="{{v.img}}" pick="Разные типы" walk="Прочитан весь — свежие" deep="Если своих нет" dark="{{dark}}" appLook="Прозрачный с тенью" models="Как программы" pending="Силуэт" hint-size="100%,100%"></dc-import>
                </sc-if>
                <sc-if value="{{it.isFile}}" hint-placeholder-val="{{false}}">
                  <dc-import name="Pending" kind="{{it.kind}}" dark="{{dark}}" hint-size="100%,100%"></dc-import>
                </sc-if>
              </div>
              <div style="position: absolute; inset: 0; opacity: {{it.readyOp}}; transition: opacity {{fadeMs}}ms;">
                <sc-if value="{{it.isFolder}}" hint-placeholder-val="{{true}}">
                  <dc-import name="Folder" folder="{{it.folder}}" variant="Адаптивный" size="{{v.img}}" pick="Разные типы" walk="Прочитан весь — свежие" deep="Если своих нет" dark="{{dark}}" appLook="Прозрачный с тенью" models="Как программы" hint-size="100%,100%"></dc-import>
                </sc-if>
                <sc-if value="{{it.isFile}}" hint-placeholder-val="{{false}}">
                  <dc-import name="Thumb" kind="{{it.kind}}" tone="{{it.tone}}" fit="{{it.fit}}" hint-size="100%,100%"></dc-import>
                </sc-if>
              </div>
            </div>
          </div>
          <div style="width: {{v.textW}}; min-width: 0; box-sizing: border-box; padding: {{v.textPad}}; display: flex; flex-direction: column; gap: 1px;">
            <div style="font-size: {{v.fs}}px; line-height: {{v.lh}}px; max-height: {{v.maxH}}px; overflow: hidden; word-break: break-word; {{v.nameExtra}}">{{it.label}}</div>
            <sc-if value="{{v.isTiles}}" hint-placeholder-val="{{false}}">
              <div style="font-size: 11px; line-height: 15px; color: {{dim}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{it.kindText}}</div>
            </sc-if>
          </div>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"look":{"editor":"enum","options":["Силуэт","Пусто — сейчас"],"default":"Силуэт","section":"Пока грузится"},"when":{"editor":"enum","options":["Через 150 мс","Сразу"],"default":"Через 150 мс","section":"Пока грузится"},"swap":{"editor":"enum","options":["Растворение 150 мс","Мгновенно"],"default":"Растворение 150 мс","section":"Пока грузится"},"pace":{"editor":"enum","options":["Как в жизни","Медленно ×4"],"default":"Как в жизни","section":"Пока грузится"},"view":{"editor":"enum","options":["Значки","Плитка","Галерея"],"default":"Значки","section":"Вид"},"dark":{"editor":"boolean","default":false,"section":"Вид"},"$preview":{"width":1280,"height":820}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { start: null, now: 0 };
  }

  componentWillUnmount() {
    if (this._timer) {
      clearInterval(this._timer);
    }
  }

  renderVals() {
    const look = this.props.look ?? 'Силуэт';
    const when = this.props.when ?? 'Через 150 мс';
    const fade = (this.props.swap ?? 'Растворение 150 мс') !== 'Мгновенно';
    const pace = (this.props.pace ?? 'Как в жизни') === 'Медленно ×4' ? 4 : 1;
    const dark = !!(this.props.dark ?? false);
    const view = this.props.view ?? 'Значки';
    const gallery = view === 'Галерея';
    const tiles = view === 'Плитка';
    // How long each picture takes, as the logs of 2026-11-08/09 have them:
    // a text sheet or a program's icon in tens of milliseconds, a RAW in a
    // third of a second, a track's shape in a second, a folder of tracks
    // waiting for three of them.
    const entries = [
      { label: 'raw', folder: 'raw', ms: 700 },
      { label: 'docs', folder: 'docs', ms: 380 },
      { label: 'Player', folder: 'Player', ms: 300 },
      { label: 'модели', folder: 'модели', ms: 900 },
      { label: 'звуки', folder: 'звуки', ms: 1800 },
      { label: 'Messenger', folder: 'Messenger', ms: 260 },
      { label: 'пустая', folder: 'пустая', ms: 25 },
      { label: 'IMG_0931.CR3', kind: 'photo', tone: 3, ms: 340, kindText: 'Снимок RAW' },
      { label: 'Hero_Albedo.png', kind: 'tex', tone: 0, ms: 90, kindText: 'Изображение PNG' },
      { label: 'drone45.mp3', kind: 'wave', tone: 1, ms: 1100, kindText: 'Звук MP3' },
      { label: 'notes.txt', kind: 'text', tone: 2, ms: 60, kindText: 'Текст' },
      { label: 'Monitor.exe', kind: 'app', tone: 0, ms: 45, kindText: 'Программа' },
      { label: 'tree.fbx', kind: 'model', tone: 0, ms: 600, kindText: 'Модель FBX' },
      { label: 'manual.pdf', kind: 'doc', tone: 0, ms: 140, kindText: 'Документ PDF' }
    ];
    const v = tiles
      ? { cellW: 260, margin: 4, pad: '6px', dir: 'row', gap: 8, align: 'left', img: 48, imgM: '0', textW: 'auto', textPad: '0', fs: 12, lh: 16, maxH: 16, nameExtra: 'white-space: nowrap; text-overflow: ellipsis;', isTiles: true }
      : gallery
        ? { cellW: 220, margin: 4, pad: '0 0 3px', dir: 'column', gap: 0, align: 'center', img: 216, imgM: '2px 0', textW: '100%', textPad: '0 6px', fs: 11, lh: 15, maxH: 15, nameExtra: 'white-space: nowrap; text-overflow: ellipsis;', isTiles: false }
        : { cellW: 132, margin: 2, pad: '0 0 3px', dir: 'column', gap: 0, align: 'center', img: 96, imgM: '2px 0', textW: '100%', textPad: '0 4px', fs: 12, lh: 17, maxH: 51, nameExtra: '', isTiles: false };
    const theme = gallery ? (dark ? 'galdark' : 'gal') : (dark ? 'dark' : 'light');
    const start = this.state.start;
    const elapsed = start === null ? Infinity : this.state.now - start;
    const showAfter = when === 'Сразу' ? 0 : 150 * pace;
    let pendingCount = 0;
    const items = entries.map((e) => {
      const pending = elapsed < e.ms * pace;
      if (pending) {
        pendingCount++;
      }
      const isFolder = !!e.folder;
      const S = v.img;
      return {
        ...e, isFolder, isFile: !isFolder,
        kindText: e.kindText ?? 'Папка',
        fw: S, fh: e.kind === 'photo' ? Math.round(S * 2 / 3) : S,
        fit: e.kind === 'photo' || e.kind === 'tex' ? 'slice' : 'meet',
        phOp: pending && look !== 'Пусто — сейчас' && elapsed >= showAfter ? 1 : 0,
        readyOp: pending ? 0 : 1
      };
    });
    const longest = Math.max(...entries.map((e) => e.ms)) * pace + 400;
    const reload = () => {
      if (this._timer) {
        clearInterval(this._timer);
      }
      const t0 = Date.now();
      this.setState({ start: t0, now: t0 });
      this._timer = setInterval(() => {
        const now = Date.now();
        if (now - t0 > longest) {
          clearInterval(this._timer);
          this._timer = null;
        }
        this.setState({ now });
      }, 25);
    };
    return {
      items, v, reload, dark,
      fadeMs: fade ? 150 * pace : 0,
      status: pendingCount > 0 ? 'грузится ' + pendingCount + ' из ' + entries.length : 'нажмите «Обновить», чтобы загрузить заново',
      themeClass: 't-' + theme,
      chrome: dark ? '#202020' : '#F3F3F3',
      fieldBg: dark ? '#2B2B2B' : '#FFFFFF',
      listBg: gallery ? (dark ? '#1E1E1E' : '#6E6E6E') : (dark ? '#1E1E1E' : '#FAFAFA'),
      fg: dark ? '#E0E0E0' : '#1A1A1A',
      listFg: gallery ? (dark ? '#E0E0E0' : '#F2F2F2') : (dark ? '#E0E0E0' : '#1A1A1A'),
      dim: dark ? '#BDBDBD' : '#555555',
      sep: dark ? '#3A3A3A' : '#DDDDDD'
    };
  }
}
</script>
</body>
</html>
