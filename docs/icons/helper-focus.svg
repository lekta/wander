<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18">
  <!-- IconHelperFocus in src/Wander.App/Views/PreviewPane.xaml, on the button's plate: black against white, sharp and marked in the middle, through a gradient at the ends. -->
  <defs>
    <linearGradient id="soft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0.15" stop-color="#1E1E1E"/>
      <stop offset="0.85" stop-color="#D8D8D8"/>
    </linearGradient>
    <linearGradient id="along" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0.15" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.38" stop-color="#FFFFFF"/>
      <stop offset="0.62" stop-color="#FFFFFF"/>
      <stop offset="0.85" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <mask id="middle"><rect x="1.5" y="1.5" width="13" height="13" fill="url(#along)"/></mask>
    <clipPath id="tile"><rect x="1.5" y="1.5" width="13" height="13" rx="2"/></clipPath>
  </defs>
  <rect x="0.5" y="0.5" width="17" height="17" rx="3" fill="#808080" fill-opacity="0.25" stroke="#808080" stroke-opacity="0.5"/>
  <g transform="translate(1,1)" clip-path="url(#tile)">
    <rect x="1.5" y="1.5" width="13" height="13" fill="url(#soft)"/>
    <g mask="url(#middle)">
      <path d="M1.5,1.5 L14.5,1.5 L1.5,14.5 Z" fill="#1E1E1E"/>
      <path d="M14.5,1.5 L14.5,14.5 L1.5,14.5 Z" fill="#D8D8D8"/>
    </g>
    <path d="M5.5,10.5 L10.5,5.5" fill="none" stroke="#FF2BD6" stroke-width="1.7" stroke-linecap="round"/>
  </g>
</svg>
