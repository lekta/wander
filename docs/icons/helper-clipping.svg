<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18">
  <!-- IconHelperClip in src/Wander.App/Views/PreviewPane.xaml, on the button's plate: black to white, kept low, and the two clipped ends past it at full height. -->
  <defs>
    <linearGradient id="range">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <clipPath id="tile"><rect x="1.5" y="1.5" width="13" height="13" rx="2"/></clipPath>
  </defs>
  <rect x="0.5" y="0.5" width="17" height="17" rx="3" fill="#808080" fill-opacity="0.25" stroke="#808080" stroke-opacity="0.5"/>
  <g transform="translate(1,1)" clip-path="url(#tile)">
    <rect x="1.5" y="1.5" width="3" height="13" fill="#3D5AFE"/>
    <rect x="11.5" y="1.5" width="3" height="13" fill="#FF3B30"/>
    <rect x="4.5" y="6" width="7" height="8.5" fill="url(#range)"/>
  </g>
</svg>
