<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- The folders pane button left of Back, NavToolbar in src/Wander.App/MainWindow.xaml: a window with its side pane, filled while the pane is shown. TextSecondary; lighter on the site's dark theme. -->
  <style>@media (prefers-color-scheme: dark) { .ink { stroke: #C8C8C8; } .pane { fill: #C8C8C8; } }</style>
  <rect class="ink" x="0.5" y="2.5" width="15" height="11" rx="1.5" fill="none" stroke="#444444"/>
  <rect class="pane" x="1" y="3" width="6" height="10" fill="#444444" fill-opacity="0.75"/>
</svg>
